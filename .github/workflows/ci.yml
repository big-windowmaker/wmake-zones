# SPDX-License-Identifier: GPL-2.0-or-later
name: CI
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Dependências
        run: |
          pacman -Syu --noconfirm --needed base-devel git meson ninja \
            libx11 libxi libxrandr libxext libxft libxrender fontconfig gtk3 cairo \
            wayland wayland-protocols librsvg \
            xorg-server-xvfb xdotool xorg-xprop xterm windowmaker \
            python python-gobject python-xlib appstream
      - uses: actions/checkout@v4
      - name: Compilar
        run: |
          meson setup build -Dprefix=/usr
          meson compile -C build
      - name: Testes (núcleo e X11 com o wmaker num Xvfb)
        run: |
          # A saída TAP (qual verificação falhou) fica no testlog.txt.
          meson test -C build --print-errorlogs || { cat build/meson-logs/testlog.txt; exit 1; }
      - name: Núcleo com sanitizers
        run: |
          meson setup asan -Db_sanitize=address,undefined -Db_lundef=false -Dprefs=disabled -Dwayland_dockapp=disabled
          meson compile -C asan
          ./asan/tests/test-engine
